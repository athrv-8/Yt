<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Birthday Surprise 🎀</title>
<style>
    body{
        margin:0;
        background:#ffe6f2;
        font-family:'Poppins', sans-serif;
        overflow-x:hidden;
    }
    .center{
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        height:100vh;
        text-align:center;
        animation:fadeIn 2s ease;
    }
    @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

    h1{
        font-size:2.4rem;
        color:#ff4da6;
        font-weight:700;
        text-shadow:0 0 10px #ffb3d9;
    }

    #balloon{
        width:140px;
        animation:float 2.5s infinite ease-in-out;
        cursor:pointer;
    }
    @keyframes float{
        0%,100%{transform:translateY(0);} 
        50%{transform:translateY(-20px);}   
    }

    button{
        background:#ff66b3;
        color:white;
        border:none;
        padding:15px 30px;
        font-size:1.2rem;
        border-radius:30px;
        box-shadow:0 0 15px #ffb3d9;
        cursor:pointer;
        transition:0.3s;
    }
    button:hover{
        transform:scale(1.05);
        background:#ff4da6;
    }

    /* Memory Core Page */
    #memoryPage{ display:none; padding-top:40px; }

    .title{
        font-family:"Brush Script MT", cursive;
        font-size:3rem;
        color:#ff4da6;
    }

    .msg{
        font-family:"Brush Script MT", cursive;
        font-size:1.6rem;
        color:#cc007a;
        text-align:center;
        padding:0 20px;
        margin-top:-10px;
    }

    .gallery{
        margin-top:40px;
        display:flex;
        justify-content:center;
    }

    .slider{
        width:280px;
        height:360px;
        overflow:hidden;
        border-radius:20px;
        box-shadow:0 0 15px #ff99cc;
        position:relative;
    }
    .slides{
        display:flex;
        width:max-content;
        animation:scroll 18s linear infinite;
    }
    .slides img{
        width:280px;
        height:360px;
        object-fit:cover;
        cursor:pointer;
    }

    @keyframes scroll{
        0%{transform:translateX(0);}   
        100%{transform:translateX(-1960px);} /* 280*7 */
    }

    /* Glass Message */
    #glass{
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.6);
        display:none;
        justify-content:center;
        align-items:center;
        backdrop-filter:blur(6px);
    }
    #glassBox{
        background:rgba(255,255,255,0.4);
        padding:30px;
        border-radius:20px;
        width:70%;
        font-family:"Brush Script MT", cursive;
        font-size:1.8rem;
        color:#d60087;
        text-align:center;
    }

    #closeGlass{
        margin-top:20px;
        background:#ff4da6;
        padding:10px 20px;
        border-radius:20px;
        color:white;
    }

    /* Next Surprise button */
    #next{
        margin-top:40px;
    }

    /* Cake Page */
    #cakePage{ display:none; text-align:center; padding-top:40px; }

    .cake{
        width:180px;
        margin:auto;
    }
    .candle{
        width:40px;
        cursor:pointer;
        animation:flicker 1s infinite;
    }
    @keyframes flicker{
        0%,100%{opacity:1;} 50%{opacity:0.6;} }

    /* Letter */
    #letterBox{
        display:none;
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.55);
        backdrop-filter:blur(6px);
        justify-content:center;
        align-items:center;
    }
    #letter{
        background:#fff0f6;
        padding:25px;
        border-radius:20px;
        width:75%;
        font-size:1.3rem;
        color:#b30059;
        font-family:"Poppins";
        box-shadow:0 0 20px pink;
        line-height:1.5;
    }

    #cutLetter{
        position:absolute;
        top:20px;
        right:20px;
        background:rgba(255,255,255,0.2);
        color:#ff1a8c;
        border:none;
        padding:10px 15px;
        font-size:1.1rem;
        border-radius:50%;
    }

    #from{
        display:none;
        margin-top:20px;
        font-family:"Brush Script MT", cursive;
        font-size:2rem;
        color:#ff1a8c;
        animation:typing 4s steps(20) forwards;
        white-space:nowrap;
        overflow:hidden;
        border-right:3px solid #ff1a8c;
        width:0;
        margin-bottom:30px;
    }
    @keyframes typing{ from{width:0;} to{width:100%;} }
</style>
</head>
<body>

<!-- HOME PAGE -->
<div id="home" class="center">
    <h1>Happy Birthday Priyanshi ji 💗</h1>
    <img id="balloon" src="https://i.imgur.com/7YV1jvZ.png" />
    <br><br>
    <button onclick="startSurprise()">Surprise 🎀</button>
</div>

<!-- MEMORY PAGE -->
<div id="memoryPage">
    <h1 class="title">Memory Core ✨</h1>

    <p class="msg">Your smile turns small moments into soft memories… 💗</p>

    <div class="gallery">
        <div class="slider">
            <div class="slides">
                <img src="https://i.imgur.com/1.jpg" onclick="openGlass('So cute 💗')">
                <img src="https://i.imgur.com/2.jpg" onclick="openGlass('Adorable vibe ✨')">
                <img src="https://i.imgur.com/3.jpg" onclick="openGlass('Pretty as always 💕')">
                <img src="https://i.imgur.com/4.jpg" onclick="openGlass('Soft aesthetic ✨')">
                <img src="https://i.imgur.com/5.jpg" onclick="openGlass('Beautiful vibe 💗')">
                <img src="https://i.imgur.com/6.jpg" onclick="openGlass('Cutest frame ❤️')">
                <img src="https://i.imgur.com/7.jpg" onclick="openGlass('Aesthetic queen ✨')">
            </div>
        </div>
    </div>

    <button id="next" onclick="goCake()">Next Surprise 🎀</button>
</div>

<!-- GLASSY MSG -->
<div id="glass">
    <div id="glassBox">
        <span id="glassText"></span>
        <br>
        <button id="closeGlass" onclick="closeGlassMsg()">Close</button>
    </div>
</div>

<!-- CAKE PAGE -->
<div id="cakePage">
    <img class="cake" src="https://i.imgur.com/tCake.png" />
    <br>
    <img class="candle" src="https://i.imgur.com/tCandle.png" onclick="openLetter()" />
</div>

<!-- LETTER -->
<div id="letterBox">
    <div id="letter">
        <button id="cutLetter" onclick="closeLetter()">X</button>
        <p id="typeText"></p>
        <div id="from">— From Shivansh</div>
    </div>
</div>

<audio id="balloonSound" src="https://d.uguu.se/yvdibNQe.mp3"></audio>
<audio id="bgm" src="https://d.uguu.se/MeGQEOwz.mp3"></audio>

<script>
function startSurprise(){
    document.getElementById('balloonSound').play();
    setTimeout(()=>{
        document.getElementById('home').style.display='none';
        document.getElementById('memoryPage').style.display='block';
        document.getElementById('bgm').play();
    },800);
}

function openGlass(msg){
    document.querySelector('.slides').style.animationPlayState='paused';
    document.getElementById('glassText').innerText=msg;
    document.getElementById('glass').style.display='flex';
}
function closeGlassMsg(){
    document.getElementById('glass').style.display='none';
    document.querySelector('.slides').style.animationPlayState='running';
}

function goCake(){
    document.getElementById('memoryPage').style.display='none';
    document.getElementById('cakePage').style.display='block';
}

function openLetter(){
    document.getElementById('letterBox').style.display='flex';
    const text = "Wishing you the softest, happiest, warmest birthday… you deserve gentle smiles today 💗✨";
    let i=0;
    const speed=45;
    function type(){
        if(i < text.length){
            document.getElementById('typeText').innerHTML += text.charAt(i);
            i++;
            setTimeout(type,speed);
        } else {
            setTimeout(()=>{
                document.getElementById('from').style.display='block';
                setTimeout(()=>{ document.getElementById('letterBox').style.display='none'; },7000);
            },600);
        }
    }
    type();
}
function closeLetter(){
    document.getElementById('letterBox').style.display='none';
}
</script>
</body>
</html>
