<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Priyanshi Ji 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom right, #ffe6f0, #fff0f5);
    overflow: hidden;
  }

  /* ---------- First Page ---------- */
  #first-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    position: relative;
    z-index: 2;
  }

  #first-page h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 4em;
    color: #ff69b4;
    text-align: center;
    margin: 0;
    animation: fadeIn 2s ease-in-out;
    z-index: 1;
    position: relative;
  }

  #first-page p {
    font-size: 1.5em;
    color: #333;
    text-align: center;
    max-width: 600px;
    margin: 20px 0 40px 0;
    line-height: 1.6;
    font-family: 'Arial', sans-serif;
  }

  .btn {
    background-color: #ff69b4;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 1.2em;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:hover {
    background-color: #ff1493;
    transform: scale(1.1);
  }

  /* ---------- Floating stars ---------- */
  .star {
    position: absolute;
    width: 4px;
    height: 4px;
    background-color: white;
    border-radius: 50%;
    opacity: 0.8;
    pointer-events: none;
    animation: floatStar linear infinite;
  }

  @keyframes floatStar {
    0% {transform: translateY(0) translateX(0); opacity: 0.8;}
    50% {opacity: 0.4;}
    100% {transform: translateY(-100vh) translateX(50px); opacity: 0;}
  }

  @keyframes fadeIn {
    0% {opacity: 0;}
    100% {opacity: 1;}
  }

  /* ---------- Second Page ---------- */
  #second-page {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    position: relative;
    text-align: center;
    background: #fff0f5;
    overflow: hidden;
  }

  #second-page h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 3em;
    color: #ff69b4;
    margin-bottom: 30px;
  }

  #cake-container {
    position: relative;
  }

  #cake {
    width: 200px;
    cursor: pointer;
    transition: transform 0.3s;
  }

  #cake:hover {
    transform: scale(1.1);
  }

  #letter {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    width: 300px;
    transform: translate(-50%, -50%);
    background: #ffe6f0;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,105,180,0.5);
    text-align: center;
    font-family: 'Dancing Script', cursive;
    z-index: 5;
  }

  #letter p {
    font-size: 1.2em;
    line-height: 1.6;
    color: #333;
  }

  #close-letter, #close-letter-2 {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 1.5em;
    color: #ff69b4;
    cursor: pointer;
    font-weight: bold;
  }

  #from-shivansh {
    display: none;
    font-family: 'Dancing Script', cursive;
    color: #ff1493;
    font-size: 1.3em;
    margin-top: 20px;
    min-height: 1.5em;
  }

  /* Next Surprise Button */
  #next-surprise {
    display: none;
    margin-top: 40px;
    background-color: #ff69b4;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    font-size: 1.2em;
    cursor: pointer;
  }

</style>
</head>
<body>

<!-- ---------- First Page ---------- -->
<div id="first-page">
  <h1>Happy Birthday Priyanshi Ji 💖</h1>
  <p>Hope your day is as sweet, fun, and adorable as you are… and maybe a little mischievous too 😉🌸</p>
  <button class="btn" id="surprise-btn">Click for a Surprise 🎁</button>
</div>

<!-- ---------- Second Page ---------- -->
<div id="second-page">
  <h1>Cake for you ✨</h1>
  <div id="cake-container">
    <img id="cake" src="https://i.ibb.co/jvMKF0ZJ/63077e8e-223e-4dd8-b0c0-d481814b33fc.gif" alt="Cake with Candle">
  </div>
  <div id="letter">
    <span id="close-letter">❌</span>
    <p id="letter-msg"></p>
    <div id="from-shivansh"></div>
    <span id="close-letter-2" style="display:none;">❌</span>
  </div>
  <button id="next-surprise">Next Surprise 🎉</button>
  <audio id="music" src="balloon-blast.mp3"></audio>
</div>

<script>
  /* ---------- Floating stars on first page ---------- */
  setInterval(() => {
    const star = document.createElement('div');
    star.classList.add('star');
    star.style.left = Math.random() * window.innerWidth + 'px';
    star.style.width = (2 + Math.random() * 3) + 'px';
    star.style.height = star.style.width;
    star.style.animationDuration = (4 + Math.random() * 4) + 's';
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 8000);
  }, 200);

  /* ---------- Click Surprise Button ---------- */
  const surpriseBtn = document.getElementById('surprise-btn');
  const firstPage = document.getElementById('first-page');
  const secondPage = document.getElementById('second-page');
  const music = document.getElementById('music');

  surpriseBtn.addEventListener('click', () => {
    firstPage.style.display = 'none';
    secondPage.style.display = 'flex';
    music.play();
  });

  /* ---------- Candle Click to open letter with typing ---------- */
  const cake = document.getElementById('cake');
  const letter = document.getElementById('letter');
  const letterMsg = document.getElementById('letter-msg');
  const closeLetter = document.getElementById('close-letter');
  const fromShivansh = document.getElementById('from-shivansh');
  const closeLetter2 = document.getElementById('close-letter-2');
  const nextSurprise = document.getElementById('next-surprise');

  const birthdayMessage = `"Priyanshi, wishing you the happiest birthday! May your smile always shine bright 💖🌸"`;

  cake.addEventListener('click', () => {
    letter.style.display = 'block';
    typeText(letterMsg, birthdayMessage);
  });

  /* ---------- Close letter first time ---------- */
  closeLetter.addEventListener('click', () => {
    letterMsg.style.display = 'none';
    closeLetter.style.display = 'none';
    fromShivansh.style.display = 'block';
    typeText(fromShivansh, "From Shivansh...");
    setTimeout(() => {
      closeLetter2.style.display = 'block';
    }, 3000);
  });

  /* ---------- Close letter second time ---------- */
  closeLetter2.addEventListener('click', () => {
    letter.style.display = 'none';
    nextSurprise.style.display = 'block';
  });

  /* ---------- Typing effect ---------- */
  function typeText(element, text) {
    element.innerHTML = '';
    let i = 0;
    const interval = setInterval(() => {
      if(i < text.length) {
        element.innerHTML += text.charAt(i);
        i++;
      } else clearInterval(interval);
    }, 50); // faster typing speed
  }
</script>

</body>
</html>
